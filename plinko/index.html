<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Plinko Game</title>
    <script type="module" crossorigin src="/plinko/assets/index-CSfWWYbH.js"></script>
    <link rel="modulepreload" crossorigin href="/plinko/assets/babylon-lights-C0WcFrZE.js">
    <link rel="modulepreload" crossorigin href="/plinko/assets/babylon-cameras-BXn5fgKH.js">
    <link rel="modulepreload" crossorigin href="/plinko/assets/babylon-meshes-5KxeLz0V.js">
    <link rel="modulepreload" crossorigin href="/plinko/assets/babylon-materials-VN8CpVdA.js">
    <link rel="modulepreload" crossorigin href="/plinko/assets/babylon-core-C-yFa0Tr.js">
    <link rel="modulepreload" crossorigin href="/plinko/assets/rapier-Ba2T-_GQ.js">
    <link rel="stylesheet" crossorigin href="/plinko/assets/index-BWw6HbbV.css">
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="loading-screen">
      <div class="loading-content">
        <div class="loading-spinner"></div>
        <h1>Plinko</h1>
        <p class="loading-text">Loading game...</p>
        <div class="loading-bar">
          <div class="loading-progress" id="loading-progress"></div>
        </div>
        <p class="loading-tip">Tip: Click anywhere to drop a ball!</p>
      </div>
    </div>

    <div id="app">
      <canvas id="renderCanvas"></canvas>
      <div id="ui-overlay">
        <!-- Score Panel -->
        <div id="score-panel">
          <div class="score-item">
            <div class="score-label">Score</div>
            <div class="score-value" id="total-score">0</div>
          </div>
          <div class="score-item small">
            <div class="score-label">Balls</div>
            <div class="score-value" id="balls-count">0/0</div>
          </div>
          <div class="score-item small">
            <div class="score-label">Active</div>
            <div class="score-value" id="active-balls">0/10</div>
          </div>
        </div>

        <!-- Instructions -->
        <div id="instructions">
          Tap to drop ball
        </div>

        <!-- Last Score Notification -->
        <div id="score-notification" class="hidden">
          +<span id="notification-score">0</span>
        </div>

        <!-- Controls -->
        <div id="controls">
          <button id="reset-btn" class="btn-secondary">Reset</button>
        </div>

        <!-- FPS Counter -->
        <div id="fps-counter" class="hidden">
          FPS: <span id="fps">60</span>
        </div>
      </div>
    </div>
  </body>
</html>
