<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Plinko Game</title>
    <script type="module" crossorigin src="/plinko/assets/index-9nAHf7Bn.js"></script>
    <link rel="modulepreload" crossorigin href="/plinko/assets/babylon-k2LZuoCp.js">
    <link rel="modulepreload" crossorigin href="/plinko/assets/rapier-Ba2T-_GQ.js">
    <link rel="stylesheet" crossorigin href="/plinko/assets/index-BWw6HbbV.css">
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="loading-screen">
      <div class="loading-content">
        <div class="loading-spinner"></div>
        <h1>Plinko</h1>
        <p class="loading-text">Loading game...</p>
        <div class="loading-bar">
          <div class="loading-progress" id="loading-progress"></div>
        </div>
        <p class="loading-tip">Tip: Click anywhere to drop a ball!</p>
        
        <!-- Browser Warning (hidden by default) -->
        <div id="browser-warning" class="hidden" style="margin-top: 20px;">
          <div style="background: rgba(255, 152, 0, 0.9); padding: 15px; border-radius: 10px; color: white;">
            <p style="margin: 0 0 10px 0; font-weight: bold;">⚠️ In-App Browser Detected</p>
            <p style="margin: 0 0 15px 0; font-size: 14px;">For best experience, please:</p>
            <button id="open-in-browser-btn" style="
              background: white;
              color: #333;
              border: none;
              padding: 12px 24px;
              border-radius: 25px;
              font-size: 16px;
              font-weight: bold;
              cursor: pointer;
              width: 100%;
            ">
              📱 Open in Browser
            </button>
            <p style="margin: 10px 0 0 0; font-size: 12px; opacity: 0.8;">
              Tap menu (•••) → "Open in Safari/Chrome"
            </p>
          </div>
        </div>
      </div>
    </div>

    <div id="app">
      <canvas id="renderCanvas"></canvas>
      <div id="ui-overlay">
        <!-- Score Panel -->
        <div id="score-panel">
          <div class="score-item">
            <div class="score-label">Score</div>
            <div class="score-value" id="total-score">0</div>
          </div>
          <div class="score-item small">
            <div class="score-label">Balls</div>
            <div class="score-value" id="balls-count">0/0</div>
          </div>
          <div class="score-item small">
            <div class="score-label">Active</div>
            <div class="score-value" id="active-balls">0/10</div>
          </div>
        </div>

        <!-- Instructions -->
        <div id="instructions">
          Tap to drop ball
        </div>

        <!-- Last Score Notification -->
        <div id="score-notification" class="hidden">
          +<span id="notification-score">0</span>
        </div>

        <!-- Controls -->
        <div id="controls">
          <button id="reset-btn" class="btn-secondary">Reset</button>
        </div>

        <!-- FPS Counter -->
        <div id="fps-counter" class="hidden">
          FPS: <span id="fps">60</span>
        </div>
      </div>
    </div>
  </body>
</html>
